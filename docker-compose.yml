services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidhapith
      POSTGRES_PASSWORD: bidhapith
      POSTGRES_DB: bidhapith
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidhapith"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bidhapith:bidhapith@postgres:5432/bidhapith
      AUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://localhost:3000
      BASE_DOMAIN: localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
